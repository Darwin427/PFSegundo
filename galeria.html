<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Galería – Campo Huerta</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&family=Fredoka+One&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --verde: #2d6a2d; --verde-m: #4caf50; --verde-p: #e8f5e9;
      --amarillo: #ffd54f; --blanco: #fff; --radio: 18px;
    }
    body { font-family: 'Nunito', sans-serif; background: var(--verde-p); min-height: 100vh; }

    /* NAV */
    nav {
      background: var(--verde);
      padding: 14px 28px;
      display: flex; align-items: center; justify-content: space-between;
      box-shadow: 0 4px 16px rgba(0,0,0,.2);
      position: sticky; top: 0; z-index: 50;
    }
    .nav-brand { display: flex; align-items: center; gap: 12px; text-decoration: none; }
    .nav-brand .ico {
      width: 42px; height: 42px; background: var(--verde-p);
      border-radius: 50%; display: grid; place-items: center;
      font-size: 22px; border: 3px solid var(--amarillo);
    }
    .nav-brand h1 {
      font-family: 'Fredoka One', cursive; color: var(--blanco); font-size: 1.25rem;
    }
    .nav-back {
      background: rgba(255,255,255,.15); color: var(--blanco);
      border: 2px solid rgba(255,255,255,.3);
      padding: 7px 18px; border-radius: 50px;
      font-family: 'Nunito', sans-serif; font-weight: 800;
      font-size: .9rem; cursor: pointer; text-decoration: none;
      transition: background .2s;
    }
    .nav-back:hover { background: rgba(255,255,255,.28); }

    /* HERO */
    .hero {
      background: linear-gradient(135deg, var(--verde) 0%, #388e3c 100%);
      padding: 52px 24px;
      text-align: center;
      position: relative; overflow: hidden;
    }
    .hero::before {
      content: '📸';
      position: absolute; font-size: 220px; opacity: .05;
      right: -40px; bottom: -40px;
    }
    .hero h2 {
      font-family: 'Fredoka One', cursive;
      font-size: clamp(1.8rem, 5vw, 3rem);
      color: var(--amarillo);
      margin-bottom: 10px;
    }
    .hero p { color: rgba(255,255,255,.88); font-size: 1.1rem; max-width: 560px; margin: 0 auto; }

    /* CONTADOR */
    .stats-bar {
      display: flex; align-items: center; justify-content: center; gap: 28px;
      padding: 20px 24px;
      background: var(--blanco);
      box-shadow: 0 2px 8px rgba(0,0,0,.07);
    }
    .stat-pill {
      display: flex; align-items: center; gap: 8px;
      font-weight: 800; color: var(--verde); font-size: .95rem;
    }
    .stat-pill span { font-size: 1.3rem; }

    /* GALERÍA */
    .gallery-wrap {
      max-width: 1200px;
      margin: 32px auto;
      padding: 0 20px;
    }

    /* Masonry con CSS columns */
    .masonry {
      columns: 4 220px;
      column-gap: 16px;
    }
    .masonry-item {
      break-inside: avoid;
      margin-bottom: 16px;
      background: var(--blanco);
      border-radius: var(--radio);
      overflow: hidden;
      box-shadow: 0 6px 20px rgba(0,0,0,.1);
      cursor: pointer;
      transition: transform .25s, box-shadow .25s;
      animation: fadeUp .4s ease both;
    }
    .masonry-item:hover {
      transform: translateY(-6px);
      box-shadow: 0 16px 36px rgba(0,0,0,.18);
    }
    @keyframes fadeUp { from{opacity:0;transform:translateY(20px)} to{opacity:1;transform:translateY(0)} }

    .masonry-item img {
      width: 100%; display: block;
      transition: transform .35s;
    }
    .masonry-item:hover img { transform: scale(1.03); }

    .masonry-footer {
      padding: 10px 14px;
      border-top: 1px solid #f5f5f5;
    }
    .masonry-footer strong {
      display: block; font-size: .9rem; color: var(--verde);
    }
    .masonry-footer small { color: #aaa; font-size: .8rem; }

    /* EMPTY */
    .empty-state {
      text-align: center; padding: 80px 20px; color: #bbb;
    }
    .empty-state .e-ico { font-size: 4rem; display: block; margin-bottom: 16px; }
    .empty-state p { font-size: 1.1rem; }

    /* LOADING */
    .loading-state {
      text-align: center; padding: 80px 20px; color: #aaa;
      font-size: 1.1rem;
    }
    .dots::after {
      content: ''; animation: dots 1.2s steps(3,end) infinite;
    }
    @keyframes dots { 0%{content:''} 33%{content:'.'} 66%{content:'..'} 100%{content:'...'} }

    /* LIGHTBOX */
    .lightbox {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,.9); z-index: 1000;
      align-items: center; justify-content: center;
      padding: 20px;
      animation: fadeIn .2s ease;
    }
    .lightbox.open { display: flex; }
    @keyframes fadeIn { from{opacity:0} to{opacity:1} }

    .lb-box {
      background: var(--blanco); border-radius: 24px;
      max-width: 780px; width: 100%; overflow: hidden;
      box-shadow: 0 28px 70px rgba(0,0,0,.6);
      animation: popIn .25s cubic-bezier(.34,1.56,.64,1);
    }
    @keyframes popIn { from{transform:scale(.85);opacity:0} to{transform:scale(1);opacity:1} }

    .lb-img-wrap { position: relative; background: #111; }
    .lb-img-wrap img { width: 100%; max-height: 500px; object-fit: contain; display: block; }

    .lb-nav {
      position: absolute; top: 50%; transform: translateY(-50%);
      background: rgba(255,255,255,.2); border: none; border-radius: 50%;
      width: 48px; height: 48px; font-size: 1.6rem; cursor: pointer;
      color: #fff; display: flex; align-items: center; justify-content: center;
      transition: background .2s;
    }
    .lb-nav:hover { background: rgba(255,255,255,.4); }
    .lb-prev { left: 12px; }
    .lb-next { right: 12px; }
    .lb-close {
      position: absolute; top: 12px; right: 12px;
      background: rgba(0,0,0,.5); border: none; color: #fff;
      width: 36px; height: 36px; border-radius: 50%; font-size: 1.1rem;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
    }
    .lb-footer {
      padding: 18px 22px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .lb-info strong { font-size: 1rem; color: var(--verde); display: block; }
    .lb-info small { color: #999; font-size: .85rem; }
    .lb-counter { font-size: .85rem; color: #bbb; font-weight: 800; }

    @media (max-width: 600px) {
      .masonry { columns: 2 150px; column-gap: 10px; }
      .masonry-item { margin-bottom: 10px; }
      .hero { padding: 36px 16px; }
      .hero h2 { font-size: 1.5rem; }
      .hero p { font-size: .95rem; }
      .stats-bar { flex-direction: column; gap: 8px; padding: 14px; }
      .gallery-wrap { padding: 0 12px; margin: 20px auto; }
      .lb-img-wrap img { max-height: 280px; }
      nav { padding: 12px 16px; }
    }

    @media (max-width: 360px) {
      .masonry { columns: 2 120px; }
    }
  </style>
</head>
<body>

  <nav>
    <a class="nav-brand" href="index.html">
      <div class="ico">🌱</div>
      <h1>Campo Huerta</h1>
    </a>
    <a class="nav-back" href="index.html">← Volver al inicio</a>
  </nav>

  <div class="hero">
    <h2>📸 Galería de la Huerta</h2>
    <p>Momentos especiales del proyecto <strong>Campo Huerta "Un mundo de saberes"</strong> — I.E. Campo Valdés, grado segundo.</p>
  </div>

  <div class="stats-bar">
    <div class="stat-pill"><span>📷</span> <span id="total-fotos">0</span> fotos compartidas</div>
    <div class="stat-pill"><span>🌱</span> Grado 2° — I.E. Campo Valdés</div>
  </div>

  <div class="gallery-wrap">
    <div id="gallery-content" class="loading-state">
      <span>Cargando fotos<span class="dots"></span></span>
    </div>
  </div>

  <!-- LIGHTBOX -->
  <div class="lightbox" id="lightbox" onclick="closeLightbox(event)">
    <div class="lb-box">
      <div class="lb-img-wrap">
        <img id="lb-img" src="" alt="Foto ampliada" />
        <button class="lb-nav lb-prev" onclick="lbNav(-1)">‹</button>
        <button class="lb-nav lb-next" onclick="lbNav(1)">›</button>
        <button class="lb-close" onclick="closeLightboxBtn()">✕</button>
      </div>
      <div class="lb-footer">
        <div class="lb-info">
          <strong id="lb-student"></strong>
          <small id="lb-date"></small>
        </div>
        <span class="lb-counter" id="lb-counter"></span>
      </div>
    </div>
  </div>

  <script type="module">
    import { db } from "./firebase-config.js";
    import {
      collection, getDocs, query, where, orderBy
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    let photos = [];

    async function loadGallery() {
      const container = document.getElementById('gallery-content');
      try {
        const q = query(
          collection(db, 'fotos'),
          where('aprobada', '==', true)
        );
        const snap = await getDocs(q);

        photos = snap.docs
          .map(d => ({ id: d.id, ...d.data() }))
          .sort((a, b) => (b.fecha?.seconds || 0) - (a.fecha?.seconds || 0));

        document.getElementById('total-fotos').textContent = photos.length;

        if (!photos.length) {
          container.innerHTML = `
            <div class="empty-state">
              <span class="e-ico">🌱</span>
              <p>Las fotos del proyecto aparecerán aquí pronto.<br>¡Pronto habrá momentos especiales para compartir!</p>
            </div>`;
          return;
        }

        container.className = 'masonry';
        container.innerHTML = photos.map((p, i) => {
          const fecha = p.fecha?.toDate
            ? p.fecha.toDate().toLocaleDateString('es-CO', { day: 'numeric', month: 'long', year: 'numeric' })
            : '';
          return `
            <div class="masonry-item" onclick="openLightbox(${i})"
                 style="animation-delay:${Math.min(i * 0.05, 0.6)}s">
              <img src="${p.url}" alt="Foto del proyecto"
                   onerror="this.parentElement.style.display='none'" loading="lazy" />
              <div class="masonry-footer">
                <strong>🧒 ${p.nombreEstudiante || 'Campo Huerta'}</strong>
                <small>${fecha}</small>
              </div>
            </div>`;
        }).join('');

      } catch (err) {
        container.innerHTML = `
          <div class="empty-state">
            <span class="e-ico">😕</span>
            <p>No se pudo cargar la galería. Intenta recargar la página.</p>
          </div>`;
        console.error(err);
      }
    }

    loadGallery();

    // LIGHTBOX
    let lbIndex = 0;

    window.openLightbox = (i) => {
      lbIndex = i;
      renderLb();
      document.getElementById('lightbox').classList.add('open');
      document.addEventListener('keydown', lbKeyHandler);
    };

    function renderLb() {
      const p = photos[lbIndex];
      document.getElementById('lb-img').src = p.url;
      document.getElementById('lb-student').textContent = '🧒 ' + (p.nombreEstudiante || 'Campo Huerta');
      document.getElementById('lb-date').textContent = p.fecha?.toDate
        ? p.fecha.toDate().toLocaleDateString('es-CO', { day: 'numeric', month: 'long', year: 'numeric' })
        : '';
      document.getElementById('lb-counter').textContent = `${lbIndex + 1} / ${photos.length}`;
    }

    window.lbNav = (dir) => {
      lbIndex = (lbIndex + dir + photos.length) % photos.length;
      renderLb();
    };

    window.closeLightbox = (e) => {
      if (e.target.id

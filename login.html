<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Acceder – Campo Huerta</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&family=Fredoka+One&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --verde: #2d6a2d; --verde-m: #4caf50; --verde-p: #e8f5e9;
      --amarillo: #ffd54f; --morado: #7b1fa2; --rojo: #e53935;
      --blanco: #fff; --radio: 20px;
    }
    body {
      font-family: 'Nunito', sans-serif;
      background: linear-gradient(135deg, #1b5e20 0%, #2e7d32 50%, #388e3c 100%);
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      padding: 20px;
    }
    body::before {
      content: '';
      position: fixed; inset: 0;
      background-image: radial-gradient(circle, rgba(255,255,255,.07) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
    }
    .card {
      background: var(--blanco);
      border-radius: 32px;
      padding: 36px 32px;
      width: 100%; max-width: 460px;
      box-shadow: 0 20px 60px rgba(0,0,0,.3);
      position: relative; z-index: 1;
    }
    .logo {
      text-align: center;
      margin-bottom: 24px;
    }
    .logo .ico {
      width: 76px; height: 76px;
      background: var(--verde-p);
      border-radius: 50%;
      display: grid; place-items: center;
      font-size: 42px;
      margin: 0 auto 10px;
      border: 4px solid var(--verde-m);
    }
    .logo h1 { font-family: 'Fredoka One', cursive; font-size: 1.7rem; color: var(--verde); }
    .logo p  { font-size: .88rem; color: #999; margin-top: 3px; }

    /* TABS */
    .tabs {
      display: flex;
      background: var(--verde-p);
      border-radius: 50px;
      padding: 4px;
      margin-bottom: 24px;
    }
    .tab {
      flex: 1; text-align: center;
      padding: 10px;
      border-radius: 50px;
      font-family: 'Fredoka One', cursive;
      font-size: 1rem;
      cursor: pointer;
      color: var(--verde);
      transition: all .2s;
      border: none; background: none;
    }
    .tab.active { background: var(--verde); color: var(--blanco); box-shadow: 0 3px 10px rgba(0,0,0,.2); }

    /* PANELS */
    .panel { display: none; }
    .panel.active { display: block; }

    /* FIELDS */
    .field { margin-bottom: 15px; }
    .field label { display: block; font-weight: 800; font-size: .88rem; color: #444; margin-bottom: 5px; }
    .field input {
      width: 100%;
      padding: 13px 16px;
      border: 2.5px solid #e0e0e0;
      border-radius: 14px;
      font-family: 'Nunito', sans-serif;
      font-size: 1rem;
      outline: none;
      transition: border-color .2s;
    }
    .field input:focus { border-color: var(--verde-m); }

    /* BTNS */
    .btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 14px;
      font-family: 'Fredoka One', cursive;
      font-size: 1.2rem;
      cursor: pointer;
      transition: transform .2s, box-shadow .2s;
      margin-top: 4px;
    }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 6px 18px rgba(0,0,0,.2); }
    .btn-verde  { background: linear-gradient(135deg, var(--verde-m), var(--verde)); color: var(--blanco); }
    .btn-morado { background: linear-gradient(135deg, #9c27b0, var(--morado)); color: var(--blanco); }

    /* SELECTOR DE ROL */
    .role-selector {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 22px;
    }
    .role-btn {
      padding: 18px 12px;
      border-radius: 18px;
      border: 3px solid #e0e0e0;
      background: var(--blanco);
      cursor: pointer;
      text-align: center;
      transition: all .2s;
      font-family: 'Nunito', sans-serif;
    }
    .role-btn:hover { border-color: var(--verde-m); background: var(--verde-p); }
    .role-btn.active-role.guardian { border-color: var(--verde-m); background: var(--verde-p); }
    .role-btn.active-role.docente  { border-color: var(--morado); background: #f3e5f5; }
    .role-ico  { font-size: 2.4rem; display: block; margin-bottom: 8px; }
    .role-name { font-family: 'Fredoka One', cursive; font-size: 1rem; color: var(--verde); }
    .role-btn.active-role.docente .role-name { color: var(--morado); }

    /* FORM REGISTRO */
    .reg-form { display: none; }
    .reg-form.active { display: block; }

    /* ALERT */
    .alert {
      padding: 12px 16px;
      border-radius: 12px;
      font-size: .9rem;
      font-weight: 700;
      margin-bottom: 14px;
      display: none;
    }
    .alert.error   { background: #ffebee; color: var(--rojo); display: block; }
    .alert.success { background: #e8f5e9; color: var(--verde); display: block; }

    .back-link {
      display: block; text-align: center;
      margin-top: 18px; color: #aaa; font-size: .88rem; text-decoration: none;
    }
    .back-link:hover { color: var(--verde); }

    .spinner {
      display: inline-block;
      width: 18px; height: 18px;
      border: 3px solid rgba(255,255,255,.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin .7s linear infinite;
      vertical-align: middle;
      margin-right: 6px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .select-hint {
      text-align: center;
      color: #aaa;
      font-size: .95rem;
      padding: 20px 0;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <div class="ico">🌱</div>
      <h1>Campo Huerta</h1>
      <p>"Un Mundo de Saberes"</p>
    </div>

    <div class="tabs">
      <button class="tab active" onclick="switchTab('login')">Iniciar Sesión</button>
      <button class="tab" onclick="switchTab('register')">Registrarme</button>
    </div>

    <div id="alert" class="alert"></div>

    <!-- ===== INICIAR SESIÓN ===== -->
    <div id="panel-login" class="panel active">
      <div class="field">
        <label>📧 Correo electrónico</label>
        <input type="email" id="login-email" placeholder="tucorreo@email.com" />
      </div>
      <div class="field">
        <label>🔒 Contraseña</label>
        <input type="password" id="login-pass" placeholder="Tu contraseña" />
      </div>
      <button class="btn btn-verde" id="btn-login" onclick="login()">🌿 Ingresar</button>
    </div>

    <!-- ===== REGISTRARME ===== -->
    <div id="panel-register" class="panel">

      <!-- Selector de rol -->
      <div class="role-selector">
        <div class="role-btn guardian" onclick="selectRole('guardian')" id="role-guardian">
          <span class="role-ico">👨‍👩‍👧</span>
          <span class="role-name">Soy Acudiente</span>
        </div>
        <div class="role-btn docente" onclick="selectRole('docente')" id="role-docente">
          <span class="role-ico">👩‍🏫</span>
          <span class="role-name">Soy Docente</span>
        </div>
      </div>

      <!-- Hint inicial -->
      <div id="role-hint" class="select-hint">👆 Selecciona tu perfil para continuar</div>

      <!-- Formulario Acudiente -->
      <div id="form-guardian" class="reg-form">
        <div class="field">
          <label>👤 Tu nombre completo</label>
          <input type="text" id="g-name" placeholder="Nombre del acudiente" />
        </div>
        <div class="field">
          <label>🧒 Nombre del estudiante</label>
          <input type="text" id="g-student" placeholder="¿De qué niño/a eres acudiente?" />
        </div>
        <div class="field">
          <label>📧 Correo electrónico</label>
          <input type="email" id="g-email" placeholder="tucorreo@email.com" />
        </div>
        <div class="field">
          <label>🔒 Contraseña</label>
          <input type="password" id="g-pass" placeholder="Mínimo 6 caracteres" />
        </div>
        <div class="field">
          <label>🔒 Confirmar contraseña</label>
          <input type="password" id="g-pass2" placeholder="Repite la contraseña" />
        </div>
        <button class="btn btn-verde" id="btn-guardian" onclick="registerGuardian()">🌱 Crear cuenta de Acudiente</button>
      </div>

      <!-- Formulario Docente -->
      <div id="form-docente" class="reg-form">
        <div class="field">
          <label>📧 Correo electrónico</label>
          <input type="email" id="d-email" placeholder="correo docente" />
        </div>
        <div class="field">
          <label>🔒 Contraseña</label>
          <input type="password" id="d-pass" placeholder="Mínimo 6 caracteres" />
        </div>
        <div class="field">
          <label>🗝️ Código Docente</label>
          <input type="password" id="d-code" placeholder="Código especial de acceso" />
        </div>
        <button class="btn btn-morado" id="btn-docente" onclick="registerDocente()">👩‍🏫 Crear cuenta Docente</button>
      </div>
    </div>

    <a href="index.html" class="back-link">← Volver al inicio</a>
  </div>

  <script type="module">
    import { auth, db } from "./firebase-config.js";
    import {
      signInWithEmailAndPassword,
      createUserWithEmailAndPassword
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import {
      doc, setDoc, getDoc
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const TEACHER_CODE = "CAMPOHUERTA2026";

    // ===== TABS =====
    window.switchTab = (tab) => {
      document.querySelectorAll('.tab').forEach((t, i) => {
        t.classList.toggle('active', (i === 0 && tab === 'login') || (i === 1 && tab === 'register'));
      });
      document.getElementById('panel-login').classList.toggle('active', tab === 'login');
      document.getElementById('panel-register').classList.toggle('active', tab === 'register');
      hideAlert();
    };

    // ===== ROL SELECTOR =====
    window.selectRole = (role) => {
      document.getElementById('role-guardian').classList.toggle('active-role', role === 'guardian');
      document.getElementById('role-docente').classList.toggle('active-role', role === 'docente');
      document.getElementById('role-hint').style.display = 'none';
      document.getElementById('form-guardian').classList.toggle('active', role === 'guardian');
      document.getElementById('form-docente').classList.toggle('active', role === 'docente');
      hideAlert();
    };

    // ===== ALERTS =====
    function showAlert(msg, type = 'error') {
      const el = document.getElementById('alert');
      el.textContent = msg;
      el.className = `alert ${type}`;
    }
    function hideAlert() {
      document.getElementById('alert').className = 'alert';
    }

    function setLoading(id, loading, defaultText) {
      const btn = document.getElementById(id);
      btn.disabled = loading;
      btn.innerHTML = loading ? '<span class="spinner"></span> Cargando...' : defaultText;
    }

    function traducirError(code) {
      const map = {
        'auth/invalid-email':        'Correo inválido',
        'auth/user-not-found':       'Usuario no encontrado',
        'auth/wrong-password':       'Contraseña incorrecta',
        'auth/invalid-credential':   'Correo o contraseña incorrectos',
        'auth/email-already-in-use': 'Este correo ya está registrado',
        'auth/weak-password':        'Contraseña muy débil (mínimo 6 caracteres)',
        'auth/too-many-requests':    'Demasiados intentos, espera un momento'
      };
      return map[code] || 'Error, intenta de nuevo';
    }

    // ===== LOGIN =====
    window.login = async () => {
      const email = document.getElementById('login-email').value.trim();
      const pass  = document.getElementById('login-pass').value;
      if (!email || !pass) { showAlert('⚠️ Completa todos los campos'); return; }

      setLoading('btn-login', true, '🌿 Ingresar');
      try {
        const cred = await signInWithEmailAndPassword(auth, email, pass);
        const snap = await getDoc(doc(db, 'usuarios', cred.user.uid));
        if (!snap.exists()) throw new Error('no-profile');
        window.location.href = snap.data().rol === 'teacher'
          ? './teacher/dashboard.html'
          : './guardian/dashboard.html';
      } catch(e) {
        showAlert('❌ ' + (e.message === 'no-profile' ? 'Perfil no encontrado' : traducirError(e.code)));
        setLoading('btn-login', false, '🌿 Ingresar');
      }
    };

    // ===== REGISTRO ACUDIENTE =====
    window.registerGuardian = async () => {
      const nombre   = document.getElementById('g-name').value.trim();
      const student  = document.getElementById('g-student').value.trim();
      const email    = document.getElementById('g-email').value.trim();
      const pass     = document.getElementById('g-pass').value;
      const pass2    = document.getElementById('g-pass2').value;

      if (!nombre || !student || !email || !pass || !pass2) {
        showAlert('⚠️ Completa todos los campos'); return;
      }
      if (pass !== pass2) { showAlert('❌ Las contraseñas no coinciden'); return; }
      if (pass.length < 6) { showAlert('❌ Mínimo 6 caracteres en la contraseña'); return; }

      setLoading('btn-guardian', true, '🌱 Crear cuenta de Acudiente');
      try {
        const cred = await createUserWithEmailAndPassword(auth, email, pass);
        await setDoc(doc(db, 'usuarios', cred.user.uid), {
          nombre, nombreEstudiante: student, email, rol: 'guardian', creadoEn: new Date()
        });
        showAlert('✅ ¡Cuenta creada! Redirigiendo...', 'success');
        setTimeout(() => { window.location.href = './guardian/dashboard.html'; }, 1500);
      } catch(e) {
        showAlert('❌ ' + traducirError(e.code));
        setLoading('btn-guardian', false, '🌱 Crear cuenta de Acudiente');
      }
    };

    // ===== REGISTRO DOCENTE =====
    window.registerDocente = async () => {
      const email = document.getElementById('d-email').value.trim();
      const pass  = document.getElementById('d-pass').value;
      const code  = document.getElementById('d-code').value.trim();

      if (!email || !pass || !code) { showAlert('⚠️ Completa todos los campos'); return; }
      if (code !== TEACHER_CODE)    { showAlert('❌ Código docente incorrecto'); return; }
      if (pass.length < 6)          { showAlert('❌ Mínimo 6 caracteres en la contraseña'); return; }

      setLoading('btn-docente', true, '👩‍🏫 Crear cuenta Docente');
      try {
        const cred = await createUserWithEmailAndPassword(auth, email, pass);
        await setDoc(doc(db, 'usuarios', cred.user.uid), {
          nombre: 'Docente', email, rol: 'teacher', creadoEn: new Date()
        });
        showAlert('✅ ¡Cuenta docente creada! Redirigiendo...', 'success');
        setTimeout(() => { window.location.href = './teacher/dashboard.html'; }, 1500);
      } catch(e) {
        showAlert('❌ ' + traducirError(e.code));
        setLoading('btn-docente', false, '👩‍🏫 Crear cuenta Docente');
      }
    };
  </script>
</body>
</html>

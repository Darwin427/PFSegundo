<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Acceder – Campo Huerta</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&family=Fredoka+One&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --verde: #2d6a2d; --verde-m: #4caf50; --verde-p: #e8f5e9;
      --amarillo: #ffd54f; --morado: #7b1fa2; --rojo: #e53935;
      --blanco: #fff; --radio: 20px;
    }
    body {
      font-family: 'Nunito', sans-serif;
      background: linear-gradient(135deg, #1b5e20 0%, #2e7d32 50%, #388e3c 100%);
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      padding: 20px;
    }
    body::before {
      content: '';
      position: fixed; inset: 0;
      background-image: radial-gradient(circle, rgba(255,255,255,.07) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
    }
    .card {
      background: var(--blanco);
      border-radius: 32px;
      padding: 40px 36px;
      width: 100%; max-width: 460px;
      box-shadow: 0 20px 60px rgba(0,0,0,.3);
      position: relative;
      z-index: 1;
    }
    .logo {
      text-align: center;
      margin-bottom: 28px;
    }
    .logo .ico {
      width: 80px; height: 80px;
      background: var(--verde-p);
      border-radius: 50%;
      display: grid; place-items: center;
      font-size: 44px;
      margin: 0 auto 12px;
      border: 4px solid var(--verde-m);
    }
    .logo h1 {
      font-family: 'Fredoka One', cursive;
      font-size: 1.7rem;
      color: var(--verde);
    }
    .logo p { font-size: .9rem; color: #888; margin-top: 4px; }

    /* TABS */
    .tabs {
      display: flex;
      background: var(--verde-p);
      border-radius: 50px;
      padding: 4px;
      margin-bottom: 28px;
    }
    .tab {
      flex: 1; text-align: center;
      padding: 10px;
      border-radius: 50px;
      font-family: 'Fredoka One', cursive;
      font-size: 1rem;
      cursor: pointer;
      color: var(--verde);
      transition: all .2s;
      border: none; background: none;
    }
    .tab.active {
      background: var(--verde);
      color: var(--blanco);
      box-shadow: 0 3px 10px rgba(0,0,0,.2);
    }

    /* FORMS */
    .form-section { display: none; }
    .form-section.active { display: block; }

    .field { margin-bottom: 16px; }
    .field label {
      display: block;
      font-weight: 800;
      font-size: .9rem;
      color: #444;
      margin-bottom: 6px;
    }
    .field input, .field select {
      width: 100%;
      padding: 13px 16px;
      border: 2.5px solid #e0e0e0;
      border-radius: 14px;
      font-family: 'Nunito', sans-serif;
      font-size: 1rem;
      outline: none;
      transition: border-color .2s;
    }
    .field input:focus, .field select:focus { border-color: var(--verde-m); }

    .btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 14px;
      font-family: 'Fredoka One', cursive;
      font-size: 1.2rem;
      cursor: pointer;
      transition: transform .2s, box-shadow .2s;
      margin-top: 6px;
    }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 6px 18px rgba(0,0,0,.2); }
    .btn-verde { background: linear-gradient(135deg, var(--verde-m), var(--verde)); color: var(--blanco); }
    .btn-morado { background: linear-gradient(135deg, #9c27b0, var(--morado)); color: var(--blanco); }

    .divider {
      display: flex; align-items: center; gap: 12px;
      margin: 20px 0;
      color: #bbb; font-size: .85rem;
    }
    .divider::before, .divider::after {
      content: ''; flex: 1;
      height: 1px; background: #e0e0e0;
    }

    .teacher-section {
      background: #f3e5f5;
      border-radius: 16px;
      padding: 20px;
      border: 2px solid #ce93d8;
    }
    .teacher-section h3 {
      font-family: 'Fredoka One', cursive;
      color: var(--morado);
      margin-bottom: 14px;
      font-size: 1.1rem;
    }

    .alert {
      padding: 12px 16px;
      border-radius: 12px;
      font-size: .9rem;
      font-weight: 700;
      margin-bottom: 14px;
      display: none;
    }
    .alert.error { background: #ffebee; color: var(--rojo); display: block; }
    .alert.success { background: #e8f5e9; color: var(--verde); display: block; }

    .back-link {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: #888;
      font-size: .9rem;
      text-decoration: none;
    }
    .back-link:hover { color: var(--verde); }

    .spinner {
      display: inline-block;
      width: 20px; height: 20px;
      border: 3px solid rgba(255,255,255,.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin .7s linear infinite;
      vertical-align: middle;
      margin-right: 8px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <div class="ico">🌱</div>
      <h1>Campo Huerta</h1>
      <p>"Un Mundo de Saberes"</p>
    </div>

    <!-- TABS -->
    <div class="tabs">
      <button class="tab active" onclick="switchTab('login')">Iniciar Sesión</button>
      <button class="tab" onclick="switchTab('register')">Registrarme</button>
    </div>

    <div id="alert" class="alert"></div>

    <!-- LOGIN -->
    <div id="login-section" class="form-section active">
      <div class="field">
        <label>📧 Correo electrónico</label>
        <input type="email" id="login-email" placeholder="tucorreo@email.com" />
      </div>
      <div class="field">
        <label>🔒 Contraseña</label>
        <input type="password" id="login-pass" placeholder="Tu contraseña" />
      </div>
      <button class="btn btn-verde" onclick="login()" id="btn-login">
        🌿 Ingresar
      </button>

      <div class="divider">acceso docente</div>

      <div class="teacher-section">
        <h3>👩‍🏫 Acceso Docente</h3>
        <div class="field">
          <label>📧 Correo</label>
          <input type="email" id="teacher-email" placeholder="correo docente" />
        </div>
        <div class="field">
          <label>🔒 Contraseña</label>
          <input type="password" id="teacher-pass" placeholder="contraseña" />
        </div>
        <div class="field">
          <label>🗝️ Código Docente</label>
          <input type="password" id="teacher-code" placeholder="Código especial" />
        </div>
        <button class="btn btn-morado" onclick="loginTeacher()" id="btn-teacher">
          👩‍🏫 Ingresar como Docente
        </button>
      </div>
    </div>

    <!-- REGISTER -->
    <div id="register-section" class="form-section">
      <div class="field">
        <label>👤 Tu nombre completo</label>
        <input type="text" id="reg-name" placeholder="Nombre del acudiente" />
      </div>
      <div class="field">
        <label>🧒 Nombre del estudiante</label>
        <input type="text" id="reg-student" placeholder="¿De qué niño/a eres acudiente?" />
      </div>
      <div class="field">
        <label>📧 Correo electrónico</label>
        <input type="email" id="reg-email" placeholder="tucorreo@email.com" />
      </div>
      <div class="field">
        <label>🔒 Contraseña</label>
        <input type="password" id="reg-pass" placeholder="Mínimo 6 caracteres" />
      </div>
      <div class="field">
        <label>🔒 Confirmar contraseña</label>
        <input type="password" id="reg-pass2" placeholder="Repite la contraseña" />
      </div>
      <button class="btn btn-verde" onclick="register()" id="btn-register">
        🌱 Crear mi cuenta
      </button>
    </div>

    <a href="index.html" class="back-link">← Volver al inicio</a>
  </div>

  <script type="module">
    import { auth, db } from "./firebase-config.js";
    import {
      signInWithEmailAndPassword,
      createUserWithEmailAndPassword
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import {
      doc, setDoc, getDoc
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const TEACHER_CODE = "CAMPOHUERTA2026";

    window.switchTab = (tab) => {
      document.querySelectorAll('.tab').forEach((t, i) => {
        t.classList.toggle('active', (i === 0 && tab === 'login') || (i === 1 && tab === 'register'));
      });
      document.getElementById('login-section').classList.toggle('active', tab === 'login');
      document.getElementById('register-section').classList.toggle('active', tab === 'register');
      hideAlert();
    };

    function showAlert(msg, type = 'error') {
      const el = document.getElementById('alert');
      el.textContent = msg;
      el.className = `alert ${type}`;
    }

    function hideAlert() {
      document.getElementById('alert').className = 'alert';
    }

    function setLoading(btnId, loading) {
      const btn = document.getElementById(btnId);
      if (loading) {
        btn.innerHTML = '<span class="spinner"></span> Cargando...';
        btn.disabled = true;
      } else {
        btn.disabled = false;
      }
    }

    window.login = async () => {
      const email = document.getElementById('login-email').value.trim();
      const pass  = document.getElementById('login-pass').value;
      if (!email || !pass) { showAlert('⚠️ Completa todos los campos'); return; }

      setLoading('btn-login', true);
      try {
        const cred = await signInWithEmailAndPassword(auth, email, pass);
        const snap = await getDoc(doc(db, 'usuarios', cred.user.uid));
        if (!snap.exists()) throw new Error('Usuario no encontrado');
        const data = snap.data();
        if (data.rol === 'teacher') {
          window.location.href = './teacher/dashboard.html';
        } else {
          window.location.href = './guardian/dashboard.html';
        }
      } catch(e) {
        showAlert('❌ ' + traducirError(e.code));
        document.getElementById('btn-login').innerHTML = '🌿 Ingresar';
        document.getElementById('btn-login').disabled = false;
      }
    };

    window.loginTeacher = async () => {
      const email = document.getElementById('teacher-email').value.trim();
      const pass  = document.getElementById('teacher-pass').value;
      const code  = document.getElementById('teacher-code').value.trim();

      if (!email || !pass || !code) { showAlert('⚠️ Completa todos los campos de docente'); return; }
      if (code !== TEACHER_CODE) { showAlert('❌ Código docente incorrecto'); return; }

      setLoading('btn-teacher', true);
      try {
        let cred;
        try {
          cred = await signInWithEmailAndPassword(auth, email, pass);
        } catch(e) {
          // Si no existe, crear la cuenta de docente
          if (e.code === 'auth/user-not-found' || e.code === 'auth/invalid-credential') {
            cred = await createUserWithEmailAndPassword(auth, email, pass);
            await setDoc(doc(db, 'usuarios', cred.user.uid), {
              nombre: 'Docente',
              email,
              rol: 'teacher',
              creadoEn: new Date()
            });
          } else throw e;
        }
        const snap = await getDoc(doc(db, 'usuarios', cred.user.uid));
        if (snap.exists() && snap.data().rol !== 'teacher') {
          showAlert('❌ Este correo no tiene perfil de docente');
          document.getElementById('btn-teacher').innerHTML = '👩‍🏫 Ingresar como Docente';
          document.getElementById('btn-teacher').disabled = false;
          return;
        }
        if (!snap.exists()) {
          await setDoc(doc(db, 'usuarios', cred.user.uid), {
            nombre: 'Docente',
            email,
            rol: 'teacher',
            creadoEn: new Date()
          });
        }
        window.location.href = './teacher/dashboard.html';
      } catch(e) {
        showAlert('❌ ' + traducirError(e.code));
        document.getElementById('btn-teacher').innerHTML = '👩‍🏫 Ingresar como Docente';
        document.getElementById('btn-teacher').disabled = false;
      }
    };

    window.register = async () => {
      const nombre   = document.getElementById('reg-name').value.trim();
      const student  = document.getElementById('reg-student').value.trim();
      const email    = document.getElementById('reg-email').value.trim();
      const pass     = document.getElementById('reg-pass').value;
      const pass2    = document.getElementById('reg-pass2').value;

      if (!nombre || !student || !email || !pass || !pass2) {
        showAlert('⚠️ Completa todos los campos'); return;
      }
      if (pass !== pass2) { showAlert('❌ Las contraseñas no coinciden'); return; }
      if (pass.length < 6) { showAlert('❌ La contraseña debe tener mínimo 6 caracteres'); return; }

      setLoading('btn-register', true);
      try {
        const cred = await createUserWithEmailAndPassword(auth, email, pass);
        await setDoc(doc(db, 'usuarios', cred.user.uid), {
          nombre,
          nombreEstudiante: student,
          email,
          rol: 'guardian',
          creadoEn: new Date()
        });
        showAlert('✅ ¡Cuenta creada! Redirigiendo...', 'success');
        setTimeout(() => { window.location.href = './guardian/dashboard.html'; }, 1500);
      } catch(e) {
        showAlert('❌ ' + traducirError(e.code));
        document.getElementById('btn-register').innerHTML = '🌱 Crear mi cuenta';
        document.getElementById('btn-register').disabled = false;
      }
    };

    function traducirError(code) {
      const map = {
        'auth/invalid-email': 'Correo inválido',
        'auth/user-not-found': 'Usuario no encontrado',
        'auth/wrong-password': 'Contraseña incorrecta',
        'auth/invalid-credential': 'Correo o contraseña incorrectos',
        'auth/email-already-in-use': 'Este correo ya está registrado',
        'auth/weak-password': 'Contraseña muy débil',
        'auth/too-many-requests': 'Demasiados intentos, espera un momento'
      };
      return map[code] || 'Error al ingresar, intenta de nuevo';
    }
  </script>
</body>
</html>

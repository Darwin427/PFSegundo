<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Juego de Memoria – Campo Huerta</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&family=Fredoka+One&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --verde: #2d6a2d; --verde-m: #4caf50; --verde-p: #e8f5e9;
      --amarillo: #ffd54f; --morado: #7b1fa2; --blanco: #fff;
    }
    body {
      font-family: 'Nunito', sans-serif;
      background: linear-gradient(135deg, #4a0072, #7b1fa2, #9c27b0);
      min-height: 100vh;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 20px;
    }
    body::before {
      content: '';
      position: fixed; inset: 0;
      background-image: radial-gradient(circle, rgba(255,255,255,.05) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
    }

    .game-wrap {
      background: var(--blanco);
      border-radius: 32px;
      padding: 28px;
      width: 100%; max-width: 620px;
      box-shadow: 0 20px 60px rgba(0,0,0,.35);
      position: relative; z-index: 1;
    }

    .game-header {
      text-align: center;
      margin-bottom: 20px;
    }
    .game-header h1 {
      font-family: 'Fredoka One', cursive;
      font-size: 1.8rem; color: var(--morado);
      margin-bottom: 8px;
    }
    .stats-row {
      display: flex; gap: 16px; justify-content: center; flex-wrap: wrap;
    }
    .stat-pill {
      background: #f3e5f5;
      color: var(--morado);
      padding: 8px 18px;
      border-radius: 50px;
      font-family: 'Fredoka One', cursive;
      font-size: 1rem;
    }

    /* GRID */
    .card-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin: 20px 0;
    }

    .mem-card {
      aspect-ratio: 1;
      cursor: pointer;
      perspective: 600px;
    }
    .mem-card-inner {
      width: 100%; height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform .4s ease;
      border-radius: 14px;
    }
    .mem-card.flipped .mem-card-inner { transform: rotateY(180deg); }
    .mem-card.matched .mem-card-inner { transform: rotateY(180deg); }
    .mem-card.matched .card-front { box-shadow: 0 0 0 4px var(--verde-m); }

    .card-front, .card-back {
      position: absolute; inset: 0;
      border-radius: 14px;
      display: flex; align-items: center; justify-content: center;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }
    .card-front {
      background: linear-gradient(135deg, #7b1fa2, #9c27b0);
      font-size: clamp(1.8rem, 5vw, 2.5rem);
      color: rgba(255,255,255,.5);
      font-family: 'Fredoka One', cursive;
      box-shadow: 0 4px 12px rgba(0,0,0,.2);
      transform: rotateY(0deg);
    }
    .card-back {
      background: var(--verde-p);
      font-size: clamp(1.6rem, 5vw, 2.4rem);
      transform: rotateY(180deg);
      border: 3px solid var(--verde-m);
      box-shadow: 0 4px 12px rgba(0,0,0,.1);
    }

    /* RESULT */
    .result-screen {
      display: none;
      text-align: center;
      padding: 10px 0;
    }
    .result-screen.show { display: block; }
    .r-emoji { font-size: 4.5rem; display: block; margin-bottom: 14px; }
    .r-title {
      font-family: 'Fredoka One', cursive;
      font-size: 2rem; color: var(--morado); margin-bottom: 10px;
    }
    .r-score {
      font-family: 'Fredoka One', cursive;
      font-size: 2.8rem; color: var(--amarillo);
      background: var(--morado);
      display: inline-block;
      padding: 12px 32px;
      border-radius: 50px;
      margin: 12px 0;
    }
    .r-msg { color: #666; font-size: 1rem; margin: 12px 0 20px; line-height: 1.6; }

    .btn {
      display: inline-block;
      padding: 13px 30px;
      border-radius: 50px;
      border: none;
      font-family: 'Fredoka One', cursive;
      font-size: 1.1rem;
      cursor: pointer;
      margin: 6px;
      transition: transform .2s, box-shadow .2s;
      text-decoration: none;
    }
    .btn:hover { transform: scale(1.05); box-shadow: 0 6px 18px rgba(0,0,0,.2); }
    .btn-morado { background: linear-gradient(135deg, #9c27b0, var(--morado)); color: var(--blanco); }
    .btn-yellow { background: var(--amarillo); color: var(--verde); }

    .saving-msg { color: #aaa; font-size: .85rem; margin-top: 10px; }
    .back-link { display: block; text-align: center; margin-top: 16px; color: #aaa; font-size: .9rem; text-decoration: none; }
    .back-link:hover { color: var(--morado); }

    @media (max-width: 400px) {
      .card-grid { gap: 7px; }
    }
  </style>
</head>
<body>
  <div class="game-wrap">

    <!-- GAME -->
    <div id="game-screen">
      <div class="game-header">
        <h1>🃏 Juego de Memoria</h1>
        <div class="stats-row">
          <span class="stat-pill">🔄 Intentos: <span id="moves">0</span></span>
          <span class="stat-pill">✅ Pares: <span id="pairs">0</span>/8</span>
          <span class="stat-pill">⏱️ <span id="timer">0</span>s</span>
        </div>
      </div>
      <div class="card-grid" id="card-grid"></div>
      <a href="../guardian/dashboard.html" class="back-link">← Volver al inicio</a>
    </div>

    <!-- RESULT -->
    <div id="result-screen" class="result-screen">
      <span class="r-emoji" id="r-emoji">🎉</span>
      <h2 class="r-title" id="r-title">¡Lo lograste!</h2>
      <div class="r-score" id="r-score">⭐ 0 pts</div>
      <p class="r-msg" id="r-msg">¡Muy bien!</p>
      <div>
        <button class="btn btn-morado" onclick="restart()">🔄 Jugar de nuevo</button>
        <a href="../guardian/dashboard.html" class="btn btn-yellow">🏠 Volver</a>
      </div>
      <p class="saving-msg" id="saving-msg">💾 Guardando resultado...</p>
    </div>

  </div>

  <script type="module">
    import { auth, db } from "../firebase-config.js";
    import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import { doc, getDoc, addDoc, collection, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const EMOJIS = ['🌱','🌻','🥕','🍅','🐛','🦋','💧','🌿'];
    let cards = [], flipped = [], matched = 0, moves = 0, timer = 0, interval = null;
    let currentUser = null, userData = null;

    onAuthStateChanged(auth, async (user) => {
      if (user) {
        currentUser = user;
        const snap = await getDoc(doc(db, 'usuarios', user.uid));
        if (snap.exists()) userData = snap.data();
      }
    });

    function shuffle(arr) {
      return [...arr, ...arr]
        .map(v => ({ v, sort: Math.random() }))
        .sort((a, b) => a.sort - b.sort)
        .map(x => x.v);
    }

    function buildGrid() {
      cards = shuffle(EMOJIS);
      matched = 0; moves = 0; flipped = [];
      document.getElementById('moves').textContent = '0';
      document.getElementById('pairs').textContent = '0';
      document.getElementById('timer').textContent = '0';
      clearInterval(interval);
      timer = 0;
      interval = setInterval(() => {
        timer++;
        document.getElementById('timer').textContent = timer;
      }, 1000);

      const grid = document.getElementById('card-grid');
      grid.innerHTML = cards.map((emoji, i) => `
        <div class="mem-card" id="card-${i}" onclick="flip(${i})">
          <div class="mem-card-inner">
            <div class="card-front">🌾</div>
            <div class="card-back">${emoji}</div>
          </div>
        </div>
      `).join('');
    }

    window.flip = (i) => {
      const card = document.getElementById('card-' + i);
      if (card.classList.contains('flipped') || card.classList.contains('matched') || flipped.length === 2) return;

      card.classList.add('flipped');
      flipped.push(i);

      if (flipped.length === 2) {
        moves++;
        document.getElementById('moves').textContent = moves;
        const [a, b] = flipped;

        if (cards[a] === cards[b]) {
          document.getElementById('card-' + a).classList.add('matched');
          document.getElementById('card-' + b).classList.add('matched');
          matched++;
          document.getElementById('pairs').textContent = matched;
          flipped = [];
          if (matched === EMOJIS.length) setTimeout(showResult, 500);
        } else {
          setTimeout(() => {
            document.getElementById('card-' + a).classList.remove('flipped');
            document.getElementById('card-' + b).classList.remove('flipped');
            flipped = [];
          }, 1000);
        }
      }
    };

    async function showResult() {
      clearInterval(interval);
      // Score: más alto = menos movimientos y menos tiempo
      const maxMoves = EMOJIS.length * 3;
      const movePts = Math.max(0, Math.round((1 - moves / maxMoves) * 50));
      const timePts = Math.max(0, Math.round((1 - timer / 120) * 50));
      const score   = Math.min(100, movePts + timePts + 10);

      document.getElementById('game-screen').style.display = 'none';
      document.getElementById('result-screen').classList.add('show');

      let emoji, title, msg;
      if (score >= 80)      { emoji='🏆'; title='¡Increíble memoria!'; msg=`¡Lo lograste en ${moves} intentos y ${timer} segundos! ¡Eres un campeón de la memoria!`; }
      else if (score >= 50) { emoji='🎉'; title='¡Muy bien hecho!'; msg=`${moves} intentos en ${timer} segundos. ¡Con más práctica serás el mejor!`; }
      else                   { emoji='🌱'; title='¡Buen intento!'; msg=`${moves} intentos en ${timer} segundos. ¡Sigue practicando, lo harás mejor!`; }

      document.getElementById('r-emoji').textContent = emoji;
      document.getElementById('r-title').textContent = title;
      document.getElementById('r-score').textContent = '⭐ ' + score + ' pts';
      document.getElementById('r-msg').textContent   = msg;

      if (currentUser && userData) {
        try {
          await addDoc(collection(db, 'resultadosJuegos'), {
            acudienteId: currentUser.uid,
            nombreEstudiante: userData.nombreEstudiante || '',
            juegoId: 'memoria-naturaleza',
            juegoNombre: 'Juego de Memoria 🃏',
            puntaje: score,
            total: 100,
            movimientos: moves,
            tiempoSegundos: timer,
            fecha: serverTimestamp()
          });
          document.getElementById('saving-msg').textContent = '✅ ¡Resultado guardado!';
        } catch(e) {
          document.getElementById('saving-msg').textContent = '⚠️ No se pudo guardar el resultado';
        }
      } else {
        document.getElementById('saving-msg').textContent = '⚠️ Inicia sesión para guardar tu puntaje';
      }
    }

    window.restart = () => {
      document.getElementById('result-screen').classList.remove('show');
      document.getElementById('game-screen').style.display = 'block';
      buildGrid();
    };

    buildGrid();
  </script>
</body>
</html>
